<h2 mat-dialog-title>{{ data ? 'Edit Post' : 'Add Post' }}</h2>

<form [formGroup]="postForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" />
    <mat-error *ngIf="postForm.controls['title'].hasError('required')">Title is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Content</mat-label>
    <textarea matInput formControlName="content" rows="6"></textarea>
    <mat-error *ngIf="postForm.controls['content'].hasError('required')">Content is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Author</mat-label>
    <input matInput formControlName="author" />
    <mat-error *ngIf="postForm.controls['author'].hasError('required')">Author is required</mat-error>
  </mat-form-field>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="postForm.invalid">
      Save
    </button>
  </mat-dialog-actions>
</form>
