<div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 16px;">
  <h4 style="margin: 0;">Institute</h4>
  <button mat-raised-button color="primary" (click)="openForm()">Add New</button>
</div>
@if (dataSource.data.length === 0) {
  <div style="padding: 20px;">
    No institutes found or loading...
  </div>
}
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table" style="width: 100%;">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let institute">{{ institute.id }}</td>
  </ng-container>

  <ng-container matColumnDef="bankCode">
    <th mat-header-cell *matHeaderCellDef>Bank Code</th>
    <td mat-cell *matCellDef="let institute">{{ institute.bankCode }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let institute">{{ institute.name }}</td>
  </ng-container>

  <ng-container matColumnDef="website">
    <th mat-header-cell *matHeaderCellDef>Website</th>
    <td mat-cell *matCellDef="let institute">{{ institute.website }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row (click)="getInstitute(institute)"
      *matRowDef="let institute; columns: displayedColumns;"></tr>

</table>
<mat-paginator [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons></mat-paginator>
