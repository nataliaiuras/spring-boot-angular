<div style="display: flex; justify-email: space-between; align-items: center; margin: 10px 16px;">
  <h4 style="margin: 0;">Banks</h4>
  <button matButton="tonal" (click)="openForm()">Add</button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let bank">{{ bank.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let bank">{{ bank.name }}</td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let bank">{{ bank.email }}</td>
  </ng-container>

  <!-- telephoneNumber Column -->
  <ng-container matColumnDef="telephoneNumber">
    <th mat-header-cell *matHeaderCellDef>telephoneNumber</th>
    <td mat-cell *matCellDef="let bank">{{ bank.telephoneNumber }}</td>
  </ng-container>

  <!-- website Column -->
  <ng-container matColumnDef="website">
    <th mat-header-cell *matHeaderCellDef>website</th>
    <td mat-cell *matCellDef="let bank">{{ bank.website  }}</td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let bank">
      <button mat-icon-button color="primary" (click)="open(bank.id)" aria-label="Open">
        <mat-icon>info</mat-icon>
      </button>
      <button mat-icon-button color="primary" (click)="openForm(bank)" aria-label="Edit">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteBank(bank.id)" aria-label="Delete">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let bank; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[ 10, 20 ]" showFirstLastButtons></mat-paginator>
