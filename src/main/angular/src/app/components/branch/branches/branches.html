<div style="display: flex; justify-email: space-between; align-items: center; margin: 10px 16px;">
  <h4 style="margin: 0;">Branch</h4>
  <button mat-raised-button color="primary" (click)="openForm()">Add New</button>
</div>

<div *ngIf="dataSource.data.length === 0" style="padding: 20px;">
  No branches found or loading...
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table" style="width: 100%;">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let branch">{{ branch.id }}</td>
  </ng-container>

  <!-- branchCode Column -->
  <ng-container matColumnDef="branchCode">
    <th mat-header-cell *matHeaderCellDef>Branch Code</th>
    <td mat-cell *matCellDef="let branch">{{ branch.branchCode }}</td>
  </ng-container>

  <!-- locationCode Column -->
  <ng-container matColumnDef="locationCode">
    <th mat-header-cell *matHeaderCellDef>Location Code</th>
    <td mat-cell *matCellDef="let branch">{{ branch.locationCode }}</td>
  </ng-container>

  <!-- bicCode Column -->
  <ng-container matColumnDef="bicCode">
    <th mat-header-cell *matHeaderCellDef>Bic Code</th>
    <td mat-cell *matCellDef="let branch">{{ branch.bicCode }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let branch">{{ branch.name }}</td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let branch">{{ branch.email }}</td>
  </ng-container>

  <!-- phoneNumber Column -->
  <ng-container matColumnDef="phoneNumber">
    <th mat-header-cell *matHeaderCellDef>Phone Number</th>
    <td mat-cell *matCellDef="let branch">{{ branch.phoneNumber }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

<mat-paginator [pageSizeOptions]="[ 10, 20 ]" showFirstLastButtons></mat-paginator>
