<div style="display: flex; justify-email: space-between; align-items: center; margin: 10px 16px;">
  <h4 style="margin: 0;">Branches</h4>
  <button matButton="tonal" (click)="openForm()">Add</button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let branch">{{ branch.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let branch">{{ branch.name }}</td>
  </ng-container>

  <!-- bicCode Column -->
  <ng-container matColumnDef="bicCode">
    <th mat-header-cell *matHeaderCellDef>Bic Code</th>
    <td mat-cell *matCellDef="let branch">{{ branch.bicCode }}</td>
  </ng-container>

  <!-- swiftCode Column -->
  <ng-container matColumnDef="swiftCode">
    <th mat-header-cell *matHeaderCellDef>Swift Code</th>
    <td mat-cell *matCellDef="let branch">{{ branch.swiftCode }}</td>
  </ng-container>

  <!-- telephoneNumber Column -->
  <ng-container matColumnDef="telephoneNumber">
    <th mat-header-cell *matHeaderCellDef>Telephone Number</th>
    <td mat-cell *matCellDef="let branch">{{ branch.telephoneNumber }}</td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let branch">{{ branch.email }}</td>
  </ng-container>

  <!-- address Column -->
  <ng-container matColumnDef="address">
    <th mat-header-cell *matHeaderCellDef>Address</th>
    <td mat-cell *matCellDef="let branch">{{ branch.address.number }} {{ branch.address.street }}, {{ branch.address.city }}</td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let branch">
      <button mat-icon-button color="primary" (click)="openDetail(branch.id)" aria-label="Open">
        <mat-icon>info</mat-icon>
      </button>
      <button mat-icon-button color="primary" (click)="openDetail2(branch)" aria-label="Open">
        <mat-icon>info 2</mat-icon>
      </button>
      <button mat-icon-button color="primary" (click)="openForm(branch)" aria-label="Edit">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteBranch(branch.id)" aria-label="Delete">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let branch; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[ 10, 20 ]" showFirstLastButtons></mat-paginator>
